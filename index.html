<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./css/style.css" rel="stylesheet" />
    <title>Document</title>
</head>

<body>
    <button class="openDialogBtn">Open modal</button>
    <div class="winDialog dialogHidden">
        <div class="winDialogBody">
            <button class="btnCloseDialog">
                <img src="/img/close.svg">
            </button>

            <h3>Регистрация</h3>
            <form class="regForm">
                <label>Имя</label><input class="name" type="text" /> <br />
                <label>Телефон</label><input class="phone" type="text" /> <br />
                <label>Email</label><input class="email" type="text" /> <br />
                <label>Пароль</label><input class="password" type="text" /> <br />

                <button class="btnOkDialog" type="button">ok</button>
            </form>

        </div>
    </div>

    <div class="littleModal modalHidden">
        <div class="littleModalBody">
            <button class="btnCloselittleModal">
                <img src="/img/close.svg">
            </button>
            <p>Сохранить данные?</p>
            <button class="btnOklittleModal">ok</button>
        </div>
    </div>
</body>
<script src="/scripts/script.js"></script>

</html>
